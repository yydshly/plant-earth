name: 学习体验反馈
description: 记录哪里没看懂、哪里跟不上，帮助下一轮改进。
title: "[学习反馈] "
labels: []
body:
  - type: markdown
    attributes:
      value: "感谢参与植物地球试用。这是公开议题，请只填写愿意公开的信息；不需要上传个人学习记录。"
  - type: input
    id: lesson
    attributes:
      label: 所在课程、地区或页面链接
      placeholder: 例如：望天树，地区证据，约0分53秒
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: 主要遇到哪种情况？
      options:
        - 不知道从哪里开始
        - 不清楚地图上的地区或标记
        - 没跟上配音、字幕或场景
        - 听完仍解释不清植物与环境的关系
        - 加载、播放或设备显示问题
        - 其他使用感受
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 你想理解什么，实际看到或听到了什么？
    validations:
      required: true
  - type: textarea
    id: takeaway
    attributes:
      label: 体验后，你现在怎样解释这株植物的分布？还有什么疑惑？
      description: 可以用自己的话写，不需要查答案。
  - type: input
    id: device
    attributes:
      label: 设备、浏览器与网络情况（可选）
      placeholder: 例如：手机浏览器，移动网络
